name: CI/CD — develop | staging | main

on:
  push:
    branches: ["develop", "staging", "main"]
  pull_request:
    branches: ["develop"]

jobs:
  estagio_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Gerar lockfile temporário
        run: npm install --package-lock-only

      - name: Instalar dependências
        run: npm install

      - name: Verificar sintaxe de todos os arquivos JS
        run: |
          find . -type f -name "*.js" \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            ! -path "./dist/*" \
            -exec node --check {} \;

  estagio_lint:
    runs-on: ubuntu-latest
    needs: estagio_build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Gerar lockfile temporário
        run: npm install --package-lock-only

      - name: Instalar dependências
        run: npm install

      - name: Instalar dependências temporárias do lint
        run: npm install --no-save eslint globals

      - name: Criar configuração temporária do ESLint
        run: |
          cat > eslint.config.js <<'EOF'
          const globals = require("globals");

          module.exports = [
            {
              files: ["**/*.js"],
              ignores: ["node_modules/**", ".git/**", "dist/**"],
              languageOptions: {
                ecmaVersion: 2021,
                sourceType: "commonjs",
                globals: {
                  ...globals.node,
                  ...globals.commonjs
                }
              },
              rules: {
                "no-unused-vars": "warn",
                "no-undef": "error"
              }
            },
            {
              files: ["**/*.test.js"],
              languageOptions: {
                globals: {
                  ...globals.jest
                }
              }
            }
          ];
          EOF

      - name: Rodar lint
        run: npx eslint .

  job_sonar:
    needs: estagio_lint
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Instalar dependências (inclui devDependencies)
        run: npm install

      - name: Rodar testes com cobertura
        run: npm run test:coverage

      - name: Criar sonar-project.properties dinâmico
        run: |
          echo "sonar.projectKey=${{ github.event.repository.name }}" > sonar-project.properties
          echo "sonar.projectName=${{ github.event.repository.name }}" >> sonar-project.properties
          echo "sonar.branch.name=${{ github.ref_name }}" >> sonar-project.properties
          echo "sonar.sources=index.js" >> sonar-project.properties
          echo "sonar.tests=index.test.js" >> sonar-project.properties
          echo "sonar.sourceEncoding=UTF-8" >> sonar-project.properties
          echo "sonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**" >> sonar-project.properties
          echo "sonar.cpd.exclusions=**/*.test.js" >> sonar-project.properties
          echo "sonar.javascript.lcov.reportPaths=coverage/lcov.info" >> sonar-project.properties

      - name: Exibir configuração do Sonar
        run: cat sonar-project.properties

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.TOKEN_SONAR }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}

  job_release_docker:
    needs: estagio_lint
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: docker.io/lucasfmp/restaurante-lucas-fernando
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build da imagem Docker
        run: |
          VERSION=$(node -p "require('./package.json').version")
          docker build -t $IMAGE_NAME:$VERSION .
          docker tag $IMAGE_NAME:$VERSION $IMAGE_NAME:staging

      - name: Push da imagem para o Docker Hub
        run: |
          VERSION=$(node -p "require('./package.json').version")
          docker push $IMAGE_NAME:$VERSION
          docker push $IMAGE_NAME:staging

  job_trivy_sonar:
    needs: job_release_docker
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: docker.io/lucasfmp/restaurante-lucas-fernando
    steps:
      - name: Checkout do código para o Sonar
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Instalar dependências (inclui devDependencies)
        run: npm install

      - name: Rodar testes com cobertura
        run: npm run test:coverage

      - name: Scan de segurança com Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:staging'
          format: 'sarif'
          output: 'trivy-report.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Criar sonar-project.properties dinâmico
        run: |
          echo "sonar.projectKey=${{ github.event.repository.name }}" > sonar-project.properties
          echo "sonar.projectName=${{ github.event.repository.name }}" >> sonar-project.properties
          echo "sonar.branch.name=${{ github.ref_name }}" >> sonar-project.properties
          echo "sonar.sources=index.js" >> sonar-project.properties
          echo "sonar.tests=index.test.js" >> sonar-project.properties
          echo "sonar.sourceEncoding=UTF-8" >> sonar-project.properties
          echo "sonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**" >> sonar-project.properties
          echo "sonar.cpd.exclusions=**/*.test.js" >> sonar-project.properties
          echo "sonar.javascript.lcov.reportPaths=coverage/lcov.info" >> sonar-project.properties

      - name: SonarQube Scan com relatório Trivy
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.TOKEN_SONAR }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.sarifReportPaths=trivy-report.sarif

  job_deploy_staging:
    needs: job_trivy_sonar
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Preparar arquivo Compose para a EC2
        run: |
          cat > docker-compose-8089.yml << 'EOF'
          services:
            app:
              image: lucasfmp/restaurante-lucas-fernando:staging
              container_name: restaurante-lucas-8089
              ports:
                - "8089:3000"
              environment:
                DB_HOST: mysql-infra
                DB_PORT: 3306
                DB_USER: root
                DB_PASS: password
                DB_NAME: restaurante_lucas
              networks:
                - rede_alunos
          networks:
            rede_alunos:
              external: true
          EOF

      - name: Copiar Compose e init.sql para a EC2 (via SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "docker-compose-8089.yml,init.sql"
          target: "/home/${{ secrets.EC2_USER }}/deploy_8089"

      - name: Executar o Deploy na EC2 (via SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            # Entra na pasta onde os arquivos foram copiados
            cd /home/${{ secrets.EC2_USER }}/deploy_8089

            # Executa o init.sql no container MySQL compartilhado
            echo "⏳ Executando init.sql no container mysql-infra..."
            sudo docker exec -i mysql-infra \
              mysql -u root -ppassword < init.sql
            echo "✅ init.sql executado com sucesso!"

            # Garante que não usará cache da imagem antiga
            sudo docker compose -f docker-compose-8089.yml pull

            # Recria o container em background com a nova imagem
            sudo docker compose -f docker-compose-8089.yml up -d

            echo "✅ Deploy do aluno 8089 finalizado com sucesso na EC2!"

  # ==========================================
  # PRODUÇÃO — branch main
  # ==========================================

  job_release_docker_prod:
    needs: estagio_lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: docker.io/lucasfmp/restaurante-lucas-fernando
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build da imagem Docker
        run: |
          VERSION=$(node -p "require('./package.json').version")
          docker build -t $IMAGE_NAME:$VERSION .
          docker tag $IMAGE_NAME:$VERSION $IMAGE_NAME:latest

      - name: Push da imagem para o Docker Hub
        run: |
          VERSION=$(node -p "require('./package.json').version")
          docker push $IMAGE_NAME:$VERSION
          docker push $IMAGE_NAME:latest

  job_trivy_sonar_prod:
    needs: job_release_docker_prod
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: docker.io/lucasfmp/restaurante-lucas-fernando
    steps:
      - name: Checkout do código para o Sonar
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Instalar dependências (inclui devDependencies)
        run: npm install

      - name: Rodar testes com cobertura
        run: npm run test:coverage

      - name: Scan de segurança com Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:latest'
          format: 'sarif'
          output: 'trivy-report.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Criar sonar-project.properties dinâmico
        run: |
          echo "sonar.projectKey=${{ github.event.repository.name }}" > sonar-project.properties
          echo "sonar.projectName=${{ github.event.repository.name }}" >> sonar-project.properties
          echo "sonar.branch.name=${{ github.ref_name }}" >> sonar-project.properties
          echo "sonar.sources=index.js" >> sonar-project.properties
          echo "sonar.tests=index.test.js" >> sonar-project.properties
          echo "sonar.sourceEncoding=UTF-8" >> sonar-project.properties
          echo "sonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**" >> sonar-project.properties
          echo "sonar.cpd.exclusions=**/*.test.js" >> sonar-project.properties
          echo "sonar.javascript.lcov.reportPaths=coverage/lcov.info" >> sonar-project.properties

      - name: SonarQube Scan com relatório Trivy
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.TOKEN_SONAR }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.sarifReportPaths=trivy-report.sarif

  job_deploy_production:
    needs: job_trivy_sonar_prod
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Preparar arquivo Compose para a EC2 (produção)
        run: |
          cat > docker-compose-8089.yml << 'EOF'
          services:
            app:
              image: lucasfmp/restaurante-lucas-fernando:latest
              container_name: restaurante-lucas-8089
              ports:
                - "8089:3000"
              environment:
                DB_HOST: mysql-infra
                DB_PORT: 3306
                DB_USER: root
                DB_PASS: password
                DB_NAME: restaurante_lucas
              networks:
                - rede_alunos
          networks:
            rede_alunos:
              external: true
          EOF

      - name: Copiar Compose e init.sql para a EC2 (via SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "docker-compose-8089.yml,init.sql"
          target: "/home/${{ secrets.EC2_USER }}/deploy_8089"

      - name: Executar o Deploy na EC2 (via SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            # Entra na pasta onde os arquivos foram copiados
            cd /home/${{ secrets.EC2_USER }}/deploy_8089

            # Executa o init.sql no container MySQL compartilhado
            echo "⏳ Executando init.sql no container mysql-infra..."
            sudo docker exec -i mysql-infra \
              mysql -u root -ppassword < init.sql
            echo "✅ init.sql executado com sucesso!"

            # Garante que não usará cache da imagem antiga
            sudo docker compose -f docker-compose-8089.yml pull

            # Recria o container em background com a nova imagem
            sudo docker compose -f docker-compose-8089.yml up -d

            echo "✅ Deploy de PRODUÇÃO finalizado com sucesso na EC2!"
