name: integracao continua e staging

on:
  push:
    branches: ["develop", "staging"]
  pull_request:
    branches: ["develop"]

jobs:
  estagio_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Gerar lockfile temporário
        run: npm install --package-lock-only

      - name: Instalar dependências
        run: npm install

      - name: Verificar sintaxe de todos os arquivos JS
        run: |
          find . -type f -name "*.js" \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            ! -path "./dist/*" \
            -exec node --check {} \;

  estagio_lint:
    runs-on: ubuntu-latest
    needs: estagio_build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Gerar lockfile temporário
        run: npm install --package-lock-only

      - name: Instalar dependências
        run: npm install

      - name: Instalar dependências temporárias do lint
        run: npm install --no-save eslint globals

      - name: Criar configuração temporária do ESLint
        run: |
          cat > eslint.config.js <<'EOF'
          const globals = require("globals");

          module.exports = [
            {
              files: ["**/*.js"],
              ignores: ["node_modules/**", ".git/**", "dist/**"],
              languageOptions: {
                ecmaVersion: 2021,
                sourceType: "commonjs",
                globals: {
                  ...globals.node,
                  ...globals.commonjs
                }
              },
              rules: {
                "no-unused-vars": "warn",
                "no-undef": "error"
              }
            }
          ];
          EOF

      - name: Rodar lint
        run: npx eslint .

  job_sonar:
    needs: estagio_lint
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar sonar-project.properties dinâmico
        run: |
          echo "sonar.projectKey=${{ github.event.repository.name }}" > sonar-project.properties
          echo "sonar.projectName=${{ github.event.repository.name }}" >> sonar-project.properties
          echo "sonar.branch.name=${{ github.ref_name }}" >> sonar-project.properties
          echo "sonar.sources=." >> sonar-project.properties
          echo "sonar.sourceEncoding=UTF-8" >> sonar-project.properties
          echo "sonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**" >> sonar-project.properties

      - name: Exibir configuração do Sonar
        run: cat sonar-project.properties

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.TOKEN_SONAR }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}

  job_release_docker:
    needs: estagio_lint
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: docker.io/lucasfmp/restaurante-lucas-fernando
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build da imagem Docker
        run: |
          VERSION=$(node -p "require('./package.json').version")
          docker build -t $IMAGE_NAME:$VERSION .
          docker tag $IMAGE_NAME:$VERSION $IMAGE_NAME:staging

      - name: Push da imagem para o Docker Hub
        run: |
          VERSION=$(node -p "require('./package.json').version")
          docker push $IMAGE_NAME:$VERSION
          docker push $IMAGE_NAME:staging

  job_trivy_sonar:
    needs: job_release_docker
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: docker.io/lucasfmp/restaurante-lucas-fernando
    steps:
      - name: Checkout do código para o Sonar
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login no Docker Hub para pull
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull da imagem Docker
        run: docker pull $IMAGE_NAME:staging

      - name: Scan de segurança com Trivy
        uses: aquasecurity/trivy-action@v0.13.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:staging
          format: json
          output: trivy-report.json

      - name: Converter relatório Trivy para Sonar External Issues
        run: |
          python3 - <<'PY'
          import json
          severity_map = {
              "CRITICAL": "CRITICAL",
              "HIGH": "MAJOR",
              "MEDIUM": "MINOR",
              "LOW": "INFO",
              "UNKNOWN": "INFO"
          }
          with open('trivy-report.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          issues = []
          for result in data.get('Results', []):
              target = result.get('Target', 'Docker image')
              for vuln in result.get('Vulnerabilities', []) or []:
                  rule_id = vuln.get('VulnerabilityID') or vuln.get('Title', 'UNKNOWN')
                  msg = vuln.get('Title', rule_id)
                  if vuln.get('InstalledVersion'):
                      msg += f" (installed: {vuln.get('InstalledVersion')})"
                  msg += f" on {target}"
                  issues.append({
                      'engineId': 'trivy',
                      'ruleId': rule_id,
                      'severity': severity_map.get(vuln.get('Severity', 'UNKNOWN'), 'INFO'),
                      'type': 'VULNERABILITY',
                      'primaryLocation': {
                          'message': msg,
                          'filePath': 'Dockerfile',
                          'textRange': {'startLine': 1}
                      }
                  })
          with open('sonar-trivy-report.json', 'w', encoding='utf-8') as f:
              json.dump({'issues': issues}, f, indent=2)
          print('Generated sonar-trivy-report.json with', len(issues), 'issues')
          PY

      - name: Criar sonar-project.properties dinâmico
        run: |
          echo "sonar.projectKey=${{ github.event.repository.name }}" > sonar-project.properties
          echo "sonar.projectName=${{ github.event.repository.name }}" >> sonar-project.properties
          echo "sonar.branch.name=${{ github.ref_name }}" >> sonar-project.properties
          echo "sonar.sources=." >> sonar-project.properties
          echo "sonar.sourceEncoding=UTF-8" >> sonar-project.properties
          echo "sonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**" >> sonar-project.properties

      - name: SonarQube Scan com relatório Trivy
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.TOKEN_SONAR }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.externalIssuesReportPaths=sonar-trivy-report.json

  job_deploy_staging:
    needs: job_trivy_sonar
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Preparar arquivo Compose com o identificador do aluno
        run: |
          # Copia o compose original para o formato fixo
          cp docker-compose.yml docker-compose-8089.yml

      - name: Copiar Compose para a EC2 (via SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "docker-compose-8089.yml"
          target: "/home/${{ secrets.EC2_USER }}/deploy_8089"

      - name: Executar o Deploy na EC2 (via SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            # Entra na pasta onde o arquivo foi copiado
            cd /home/${{ secrets.EC2_USER }}/deploy_8089

            # Garante que não usará cache da imagem antiga
            docker compose -f docker-compose-8089.yml pull
            
            # Recria o container em background com a nova imagem
            docker compose -f docker-compose-8089.yml up -d

            echo "✅ Deploy do aluno 8089 finalizado com sucesso na EC2!"
